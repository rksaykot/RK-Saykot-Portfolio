    <script>
      // Apply saved theme before paint to avoid light/dark flash.
      (function () {
        try {
          var saved = localStorage.getItem('saykot-theme');
          var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'prodark' : 'prolight');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
